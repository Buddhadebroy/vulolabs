name: vulobackup-test
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp
    ports: ["127.0.0.1:33077:3306"]
  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: vbtestkey
      MINIO_ROOT_PASSWORD: vbtestsecret123
    ports: ["127.0.0.1:9077:9000"]
  sftp:
    image: atmoz/sftp
    command: vbuser:vbpass123:1001::upload
    ports: ["127.0.0.1:2277:22"]
